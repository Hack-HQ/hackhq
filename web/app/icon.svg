<!-- HackHQ tab mark: an "HQ" monogram in the site's own register - ink tile,
     paper letterforms, the Q's tail in coral (the same accent the status dots
     and closing-soon copy carry). Pure geometry, no font dependency, so it
     renders identically everywhere an SVG favicon is supported. favicon.ico
     and apple-icon.png are rasterizations of this exact drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0d0b0a"/>
  <!-- H -->
  <rect x="9" y="19" width="5.5" height="26" fill="#f4ede2"/>
  <rect x="22.5" y="19" width="5.5" height="26" fill="#f4ede2"/>
  <rect x="9" y="29.25" width="19" height="5.5" fill="#f4ede2"/>
  <!-- Q -->
  <circle cx="42.5" cy="32" r="10" fill="none" stroke="#f4ede2" stroke-width="5.5"/>
  <line x1="45.5" y1="36.5" x2="52.5" y2="44.5" stroke="#ed5b29" stroke-width="5.5" stroke-linecap="round"/>
</svg>
