# .github/workflows/site_freshness.yml
name: Site freshness

# Does the live site actually show every hackathon in the repo?
#
# Nothing answered that question before, which is why it was reported by a
# person rather than by CI: a hackathon added after the last deploy is invisible
# to visitors while `listings.json`, the README table, Supabase and every
# existing check all agree that it exists. Green CI, correct data, missing
# hackathon.
#
# This is an end-to-end check against the real public site, not an inspection of
# a build, so it catches every cause of that symptom rather than the one we
# happened to predict: no deploy ran, a deploy failed, a deploy shipped from a
# stale checkout, or the Worker was rolled back.
#
# When it runs:
#   - after every run of the Deploy workflow (workflow_run), so a deploy that
#     shipped the wrong thing, or a sweep that decided there was nothing to
#     ship, is checked within minutes rather than at the next hour mark;
#   - hourly, as a backstop for a Worker rolled back or deployed from outside
#     CI (which is how a Clerk development build reached production for days
#     in 2026-08, see check_site_freshness.py);
#   - on human pushes to the files involved.
#   A push made with the default GITHUB_TOKEN starts no workflow run, so the
#   push trigger alone would never see bot-written listings - the same gap
#   sync_supabase.yml documents and test_workflows.py pins down.

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/listings.json'
      - '.github/scripts/check_site_freshness.py'
      - '.github/workflows/site_freshness.yml'
  workflow_run:
    workflows: ['Deploy to Cloudflare']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # To re-run deploy.yml (workflow_dispatch) when another pipeline's build is
  # found sitting on production - see the "Heal" step below.
  actions: write

concurrency:
  group: site-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the script can say how many commits behind main the
          # live build is (git rev-list <live sha>..HEAD).
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r .github/scripts/requirements.txt

      # Fails the job when the site is behind the repo, or is not serving the
      # page to browsers. That is the point: this workflow exists to convert a
      # silent, visitor-facing problem into a red run someone gets notified
      # about. The script's output names what is wrong and how to fix it.
      - name: Check every listing is live
        id: check
        run: python .github/scripts/check_site_freshness.py

      # The one failure this workflow can fix on its own. A Clerk development
      # build on production means a pipeline other than deploy.yml deployed this
      # Worker (Cloudflare Workers Builds did so ~1 minute after every push to
      # main until it was disconnected - web/README.md -> Deployment -> Workers
      # Builds). Deploying again from deploy.yml puts the correct build back;
      # the other pipeline only fires on a push, so this converges. The run
      # still fails above, so the event is never silent - this only shortens
      # how long visitors see the broken build. workflow_dispatch is one of the
      # two events a GITHUB_TOKEN may start.
      - name: Heal - redeploy over a development build
        if: failure() && steps.check.outputs.clerk_dev == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main -f force=true
          echo "::warning::Production was serving a Clerk development build; dispatched deploy.yml with force to replace it. Disconnect Cloudflare Workers Builds to stop this recurring (web/README.md -> Deployment)."

      # Also written to the run summary, so the answer is visible without
      # opening logs.
      - name: Report
        if: always()
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          set -eu
          if [ "${STALE:-}" = "true" ]; then
            {
              echo "## Site is behind the repository"
              echo
              echo '```'
              printf '%s\n' "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Site is up to date with listings.json" >> "$GITHUB_STEP_SUMMARY"
          fi
