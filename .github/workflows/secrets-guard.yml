name: Secrets Guard

# Separate from web-ci.yml on purpose. That workflow is path-filtered to
# `web/**`, `.github/scripts/**` and `.github/workflows/**`, so a commit whose
# only change is a stray `.env` at the repo root would not start a single job.
# A secret guard that can be skipped by choosing the right filename is not a
# guard, so this workflow carries no path filter at all.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same rule as .githooks/pre-commit, applied to what was actually pushed
  # rather than to the local index. This is what makes the hook's bypasses
  # harmless: `git commit --no-verify`, a clone with no `core.hooksPath`, an edit
  # made in the GitHub web UI, and a merge that reintroduces a deleted file all
  # still have to pass through here before anything reaches main.
  env-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 so the merge base / pushed range below actually resolves.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Reject env files
        env:
          # Via env rather than inline `${{ }}` so nothing from the event payload
          # is ever spliced into the shell source.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          # Basename rule, identical to .githooks/pre-commit: `.env` or
          # `.env.<anything>` is refused; a basename of exactly `.env.example` is
          # the one tracked template and is allowed.
          filter() {
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "${path##*/}" in
              .env.example) ;;
              .env | .env.*) printf '%s\n' "$path" ;;
              esac
            done
          }

          # 1. Nothing matching may be tracked in the tree at all. Catches a file
          #    that landed long ago and is still sitting there.
          tracked=$(git ls-files -z | tr '\0' '\n' | filter)

          # 2. Nothing matching may appear in any commit this event introduces.
          #    `git log --name-only` over the range, not a two-point diff: a file
          #    added in one commit and deleted in the next is a net-zero diff but
          #    a permanent entry in the history, which is the whole problem.
          base=
          if [ -n "${PR_BASE:-}" ]; then
            # Three-dot semantics come free: `log base..head` on a PR's merge
            # commit already walks only what the branch adds.
            base=$PR_BASE
          elif [ -n "${PUSH_BEFORE:-}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          # `base` stays empty for a branch's first push (before is all zeroes)
          # and for a force-push whose old tip is gone; check 1 still applies.
          introduced=
          if [ -n "$base" ]; then
            introduced=$(git log --format= --name-only --diff-filter=ACMR "$base..$HEAD_SHA" | filter | sort -u)
          fi

          status=0
          if [ -n "$tracked" ]; then
            echo "::error::env file(s) tracked in the repository:"
            printf '%s\n' "$tracked" | sed 's/^/  /'
            status=1
          fi
          if [ -n "$introduced" ]; then
            echo "::error::env file(s) added by these commits:"
            printf '%s\n' "$introduced" | sed 's/^/  /'
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo
            echo "Real values belong in web/.env.local, which is gitignored. Only"
            echo ".env.example (all values empty) is tracked."
            echo "Removing the file in a later commit is not enough - the value is"
            echo "still in the history and must be rotated:"
            echo "docs/runbooks/rotate-credentials.md"
          fi
          exit "$status"

  # Content scan, as opposed to the filename scan above: catches a key pasted
  # into a source file, a test fixture, or .env.example.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because the scan below walks every commit, not the tip.
      # A secret that was committed and then "removed" is still readable by
      # anyone who clones, so the tip alone is the wrong thing to look at.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks/gitleaks-action. The action is
      # pinnable (v2 = commit ff98106e4c7b2bc287b24eaf42907196329070c7) but since
      # v2.0.0 it is commercially licensed and *requires* a GITLEAKS_LICENSE
      # secret for repositories owned by an organization, which Hack-HQ is. The
      # CLI is the same scanner under MIT, needs no secret, and pins by release
      # tag plus checksum — which is a stronger supply-chain guarantee than a
      # SHA-pinned action that downloads a `latest` binary at run time.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt. Bump both values together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" version

      # `--redact` is not optional: without it a real finding gets reprinted into
      # a public build log, which is a second disclosure on top of the first.
      # Config is /.gitleaks.toml (allowlists, each one reasoned about there).
      - name: Scan full history
        run: |
          set -eu
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
